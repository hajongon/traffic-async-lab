server:
  port: 8081

spring:
  application:
    name: before-sync-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/before_orders}
    username: ${SPRING_DATASOURCE_USERNAME:before}
    password: ${SPRING_DATASOURCE_PASSWORD:before}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  initial-stock: ${APP_INITIAL_STOCK:1000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
