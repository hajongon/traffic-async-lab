server:
  port: 8083

spring:
  application:
    name: after-async-worker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/after_orders}
    username: ${SPRING_DATASOURCE_USERNAME:after}
    password: ${SPRING_DATASOURCE_PASSWORD:after}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:after}
    password: ${SPRING_RABBITMQ_PASSWORD:after}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  queue:
    exchange: orders.exchange
    routing-key: orders.created
    queue: orders.created.queue
    dead-letter-exchange: orders.dlx
    dead-letter-queue: orders.created.dlq
    dead-letter-routing-key: orders.created.dead

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
