global:
  scrape_interval: 5s

scrape_configs:
  - job_name: before-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["before-api:8081"]

  - job_name: after-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["after-api:8082"]

  - job_name: after-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["after-worker:8083"]

  - job_name: rabbitmq-after
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq-after:15692"]
